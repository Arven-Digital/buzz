name: Dependency Audit
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: read
jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit
  rust:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lockfile: [Cargo.lock, desktop/src-tauri/Cargo.lock]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616
      - uses: taiki-e/install-action@0fd46367812ee04360509b4169d9f659d6892bb2
        with:
          tool: cargo-audit@0.22.2
      # Intentionally no inherited cargo-deny exceptions: outstanding findings
      # remain blocking until their dependency paths are actually repaired.
      - run: cargo audit --file '${{ matrix.lockfile }}'
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [benchmarks/harbor-buzz-orchestra, benchmarks/harbor-buzz-orchestra/testbed]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - run: python3 -m pip install uv pip-audit==2.10.1
      - run: uv export --project '${{ matrix.project }}' --frozen --no-hashes --no-emit-workspace --no-emit-package harbor-buzz-orchestra -o audit-requirements.txt
      - run: pip-audit -r audit-requirements.txt --no-deps --disable-pip
